- id: DES-001
  category: design
  severity: medium
  message: Purple-to-blue gradient is a common vibecoded tell.
  fix: Pick a palette tied to your brand and use flat color or a subtle single-hue gradient.
  extensions: [css, scss, html, jsx, tsx]
  match:
    kind: line_regex
    pattern: '(?i)linear-gradient\([^)]*(purple|violet|indigo)[^)]*(blue|cyan)|from-(purple|violet|indigo)-\d+.*to-(blue|cyan)-\d+'
  examples:
    flag:
      - 'background: linear-gradient(135deg, purple, blue);'
      - '<div class="bg-gradient-to-r from-purple-500 to-blue-500">'
    pass:
      - 'background: linear-gradient(90deg, #111, #222);'

- id: DES-002
  category: design
  severity: low
  message: Inter used as the font family.
  fix: Choose a typeface that fits the product, or at least pair Inter with a distinctive heading font.
  extensions: [css, scss]
  match:
    kind: line_regex
    pattern: '(?i)font-family:[^;]*\binter\b'
  examples:
    flag:
      - 'font-family: Inter, sans-serif;'
    pass:
      - 'font-family: Georgia, serif;'

- id: DES-003
  category: design
  severity: low
  message: Emoji in a heading.
  fix: Replace the emoji with a real icon or remove it.
  extensions: [html, jsx, tsx]
  match:
    kind: line_regex
    pattern: '<h[1-3][^>]*>[^<]*\p{Emoji_Presentation}'
  examples:
    flag:
      - "<h1>\U0001F680 Launch faster</h1>"
    pass:
      - '<h1>Launch faster</h1>'
