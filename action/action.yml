name: Shipcheck
description: Scan a project for legal, security and design problems and report the result on pull requests.
author: eyadstein
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    default: "."
  fail-under:
    description: Fail the job when the score is below this number (0 to 100). 0 never fails.
    default: "0"
  rules:
    description: Directory with rule files. Empty uses the rules shipped with this action.
    default: ""
  comment:
    description: Post the result as a pull request comment (true or false).
    default: "true"
  github-token:
    description: Token used to post the comment. Needs pull-requests write permission.
    default: ${{ github.token }}
  api-url:
    description: Base URL of a Shipcheck API to upload the report to. Empty skips the upload.
    default: ""
  api-key:
    description: API key for the Shipcheck API.
    default: ""
  project:
    description: Project name used for the upload. Empty uses the repository name.
    default: ""

outputs:
  score:
    description: The score from 0 to 100.
    value: ${{ steps.report.outputs.score }}
  findings:
    description: The number of findings.
    value: ${{ steps.report.outputs.findings }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Build the Shipcheck scanner
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        cargo build --release --locked -p shipcheck-cli --manifest-path "$ACTION_PATH/../Cargo.toml"

    - name: Scan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCAN_PATH: ${{ inputs.path }}
        RULES_DIR: ${{ inputs.rules }}
      run: |
        set -euo pipefail
        rules="${RULES_DIR:-$ACTION_PATH/../rules}"
        report="$RUNNER_TEMP/shipcheck-report.json"
        "$ACTION_PATH/../target/release/shipcheck" "$SCAN_PATH" --rules "$rules" --format json > "$report"
        echo "SHIPCHECK_REPORT=$report" >> "$GITHUB_ENV"

    - name: Report
      id: report
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SHIPCHECK_FAIL_UNDER: ${{ inputs.fail-under }}
        SHIPCHECK_SCAN_PATH: ${{ inputs.path }}
        SHIPCHECK_COMMENT: ${{ inputs.comment }}
        SHIPCHECK_TOKEN: ${{ inputs.github-token }}
        SHIPCHECK_API_URL: ${{ inputs.api-url }}
        SHIPCHECK_API_KEY: ${{ inputs.api-key }}
        SHIPCHECK_PROJECT: ${{ inputs.project }}
      run: node "$ACTION_PATH/src/run.ts"
