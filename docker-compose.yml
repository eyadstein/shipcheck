services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shipcheck
      POSTGRES_PASSWORD: shipcheck
      POSTGRES_DB: shipcheck
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - shipcheck-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipcheck"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  shipcheck-db:
